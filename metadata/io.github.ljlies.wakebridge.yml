Name: WakeBridge
Summary: An alarm that wakes you after a set amount of actual sleep
Description: |-
  An alarm that wakes you after a set amount of actual sleep, not after a set time.

  WakeBridge works with Gadgetbridge and a watch or band that reports when you fall asleep and
  wake up (for example Amazfit/Mi Band, Zepp OS and Xiaomi devices). Gadgetbridge tells
  WakeBridge when you fall asleep and wake up; WakeBridge counts the time asleep and has
  Gadgetbridge set the alarm on the watch. Brief awakenings pause the count.

  * Separate settings for naps and nights, with a timeline of the day.
  * Nights never ring later than the night's end.
  * A fail-safe alarm, and a backup alarm on the phone in case the watch one is missed.

  In English and Italian. Requires Gadgetbridge.

