Name: Fryer Clock
Summary: Log when an air fryer's heating elements are on
Description: |-
  A single-player "chess clock" for logging when an air fryer's heating elements are on.

  Tap the button for whatever is heating right now (top element, bottom element or no element)
  and the app keeps a clock, the number of switches and the full timeline for each, then saves
  the run and exports everything as JSON.

